services:
  postgres_18:
    image: postgres:18.4-alpine
    container_name: postgres_18
    # Setting to "unless-stopped" will make the container to automatically starts when docker starts
    restart: "no"
    environment:
      POSTGRES_DB: eventticketing
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
    ports:
      # Exposing to port 54321
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
#    networks:
#      - keycloak-net

