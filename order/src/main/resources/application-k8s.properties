spring.application.name=order
spring.main.banner-mode=off
server.address=0.0.0.0
server.port=8081
# The optional: prefix ensures the app still boots up in production if the local .env is missing
spring.config.import=optional:file:./infra/.env[.properties]

# GraphQL
spring.graphql.graphiql.enabled=true

# Database Connection
spring.datasource.url=jdbc:postgresql://host.docker.internal:54321/orders
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Tell HikariCP to keep trying to connect even if the database is offline at boot
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=15000

# Kafka producer
spring.kafka.bootstrap-servers=host.docker.internal:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.objectmapper=jacksonObjectMapper
spring.kafka.producer.properties.max.block.ms=15000

# Kafka consumer
spring.kafka.consumer.group-id=tickets
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.eventtickets.ticket
spring.kafka.consumer.properties.spring.json.type.mapping=com.eventtickets.ticket.TicketUpdatedEvent:com.eventtickets.order.ticket.TicketUpdatedEvent,com.eventtickets.ticket.TicketCreatedEvent:com.eventtickets.order.ticket.TicketCreatedEvent

# Security
# Replace with your Keycloak host, realm name, and port
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/my-graphql-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/my-graphql-realm/protocol/openid-connect/certs
# The custom client ID or intended audience assigned in Keycloak
spring.security.oauth2.resourceserver.jwt.audience=http://my-graphql-api

# Logging
logging.level.com.eventtickets.order=DEBUG
logging.level.org.springframework.jdbc.core=INFO
