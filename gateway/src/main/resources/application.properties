spring.application.name=gateway
spring.main.banner-mode=off
server.address=localhost
server.port=8084
# The optional: prefix ensures the app still boots up in production if the local .env is missing
spring.config.import=optional:file:./infra/.env[.properties]

# Security
# Replace with your Keycloak host, realm name, and port
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9091/realms/event-ticketing
# Intended audience assigned in Keycloak
spring.security.oauth2.resourceserver.jwt.audience=http://gateway
spring.security.oauth2.resourceserver.jwt.resource-access-key=gateway-service

# Cloud Gateway
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.httpclient.connect-timeout=3000
spring.cloud.gateway.httpclient.response-timeout=10s

# Service discovery
# If using Kubernetes Discovery:
#spring.cloud.kubernetes.discovery.enabled=true
# OR if using Netflix Eureka:
#eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# Enable Simple Discovery Client
spring.cloud.discovery.enabled=true
spring.cloud.discovery.client.simple.instances.ticket-service[0].instance-id=ticket-service
spring.cloud.discovery.client.simple.instances.ticket-service[0].host=localhost
spring.cloud.discovery.client.simple.instances.ticket-service[0].port=8082

spring.cloud.discovery.client.simple.instances.order-service[0].instance-id=order-service
spring.cloud.discovery.client.simple.instances.order-service[0].host=localhost
spring.cloud.discovery.client.simple.instances.order-service[0].port=8081

spring.cloud.discovery.client.simple.instances.payment-service[0].instance-id=payment-service
spring.cloud.discovery.client.simple.instances.payment-service[0].host=localhost
spring.cloud.discovery.client.simple.instances.payment-service[0].port=8083

# Custom
gateway.graphql.secret=${GATEWAY_SECRET}
# Contains the URL of the UI client
gateway.graphql.cors.allowed-origins=http://localhost:8085
gateway.graphql.cors.allowed-methods=GET,POST,OPTIONS,PUT,DELETE

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=INFO
