      variables:
        - name: token
          value: eyJhbGciOiJSUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICJpTFVublVsVFJZaHpNZE5jS0ZBdXhrME9lcGdURVpBUks3aEJxQ0U2RDZJIn0..dgqklCDRIAZ1trzi6lniTigmJmfQO-JFdTMk4XXzYPop6oBOfHDwe9XouDBMluB60bY_JmoW9bOkOYkUP4_AJbcdo0SyrvF2_DNuh7WrlH4JPDYRiUzj4pQhaegPa1pdj68yunE9E2Dea0gB9eQfFr8AB4w6A28U5cLnZhWtg_gqJSu4iY-nbLLA8H4yxgarswhgdzHQcXUJpJcbNw4TN8oaX16LDklbDyjpd0rTe0irmIhH6Hoke8P49Q3NApIavnwDOgNPJe6vbPBYPbo9EYW_ppjcH0vLDcAdqCXC4wgw8YeNYAyh47IEN2JV4ec9C8SS9DPSDGlqV05YmDhl3w
