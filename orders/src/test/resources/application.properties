spring.application.name=orders
spring.main.banner-mode=off
server.port=8081

# Completely switch off Flyway during test phases
spring.flyway.enabled=false

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:54321/db
spring.datasource.username=username
spring.datasource.password=pass

# Kafka consumer
spring.kafka.consumer.group-id=tickets
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.eventtickets.tickets
spring.kafka.consumer.properties.spring.json.type.mapping=com.eventtickets.tickets.TicketUpdatedEvent:com.eventtickets.orders.tickets.TicketUpdatedEvent,com.eventtickets.tickets.TicketCreatedEvent:com.eventtickets.orders.tickets.TicketCreatedEvent
