spring.application.name=orders
spring.main.banner-mode=off
server.port=8081
# The optional: prefix ensures the app still boots up in production if the local .env is missing
spring.config.import=optional:file:./infra/.env[.properties]

# GraphQL
spring.graphql.graphiql.enabled=true

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:54321/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=outbox-relay-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.outbox_relay_service.unit
spring.kafka.consumer.properties.spring.json.type.mapping=com.example.outbox_relay_service.unit.UnitMessage:com.example.graphql_service.unit.UnitMessage

# Security
# Replace with your Keycloak host, realm name, and port
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/my-graphql-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/my-graphql-realm/protocol/openid-connect/certs
# The custom client ID or intended audience assigned in Keycloak
spring.security.oauth2.resourceserver.jwt.audience=http://my-graphql-api

#
gateway.graphql.shared.secret=${GATEWAY_SECRET}

# Logging
logging.level.com.eventtickets.orders=DEBUG

