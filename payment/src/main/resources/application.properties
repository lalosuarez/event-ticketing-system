spring.application.name=payment
spring.main.banner-mode=off
server.address=localhost
server.port=8083
# The optional: prefix ensures the app still boots up in production if the local .env is missing
spring.config.import=optional:file:./infra/.env[.properties]

# GraphQL
spring.graphql.graphiql.enabled=true

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:54321/payments
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Kafka producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.objectmapper=jacksonObjectMapper
spring.kafka.producer.properties.max.block.ms=15000

# Kafka consumer
spring.kafka.consumer.group-id=payment
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.eventtickets.messaging.order

# Security
# Replace with your Keycloak host, realm name, and port
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9091/realms/event-ticketing
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9091/realms/event-ticketing/protocol/openid-connect/certs
# Intended audience assigned in Keycloak
spring.security.oauth2.resourceserver.jwt.audience=http://payment
spring.security.oauth2.resourceserver.jwt.resource-access-key=payment-service
gateway.graphql.secret=${GATEWAY_SECRET}

# Logging
logging.level.com.eventtickets.payment=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.kafka=ERROR
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.security=ERROR
